<html lang="fr">
<head>

<title>Mieux se connaître — Tests de personnalité</title>

<style>
:root{
  --bg:#f6f2ec; --card:#fffdf9; --ink:#1f1b16; --muted:#6b6259; --line:#e6ded3;
  --soft:#efe8de; --shadow:0 1px 2px rgba(40,30,20,.06),0 6px 24px rgba(40,30,20,.06);
  --accent:#c2552d;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#171513;--card:#211e1b;--ink:#f1ebe3;--muted:#a59b90;--line:#36312c;--soft:#2b2723;--shadow:0 1px 2px rgba(0,0,0,.3)}
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 60px}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:700;letter-spacing:-.01em;line-height:1.15}
h1{font-size:clamp(2rem,6vw,2.8rem)}
h2{font-size:1.6rem}
h3{font-size:1.15rem}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lead{color:var(--muted);font-size:1.05rem;margin-top:10px;max-width:52ch}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.grid{display:grid;gap:14px;margin-top:26px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.test-card{text-align:left;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
.test-card:hover{transform:translateY(-2px);border-color:var(--c)}
.test-card .dot{width:38px;height:38px;border-radius:12px;background:var(--c);display:grid;place-items:center;color:#fff;font-weight:700;font-family:"Fraunces",serif;font-size:1.1rem}
.test-card p{color:var(--muted);font-size:.94rem}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:.76rem;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--muted);font-weight:500}
.done-badge{position:absolute;top:16px;right:16px;font-size:.72rem;font-weight:700;color:var(--c)}
.section-title{margin-top:40px;margin-bottom:12px}
.hist-item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.hist-item:last-child{border:none}
.hist-item b{display:block}
.hist-item span{color:var(--muted);font-size:.82rem;white-space:nowrap}
.link-btn{color:var(--muted);text-decoration:underline;font-size:.85rem;margin-top:10px}
/* Test screen */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;font-size:.92rem;padding:6px 0}
.progress{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin:14px 0 26px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.qcount{font-size:.85rem;color:var(--muted);font-weight:500}
.question{font-family:"Fraunces",serif;font-size:clamp(1.35rem,4.5vw,1.7rem);font-weight:500;line-height:1.3;min-height:3.2em}
.options{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.opt{width:100%;text-align:left;padding:15px 18px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-size:1rem;font-weight:500;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.likert .opt{display:flex;align-items:center;gap:12px}
.likert .opt .n{width:28px;height:28px;flex:none;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted)}
.likert .opt.sel .n{background:var(--accent);border-color:var(--accent);color:#fff}
.nav{display:flex;justify-content:space-between;margin-top:22px}
.ghost{color:var(--muted);font-weight:500;padding:8px 0}
.ghost:disabled{opacity:.35;cursor:default}
.primary{background:var(--accent);color:#fff;padding:13px 22px;border-radius:12px;font-weight:700}
.secondary{background:var(--soft);padding:13px 22px;border-radius:12px;font-weight:700}
/* Intro */
.intro p{color:var(--muted);margin-top:12px}
.intro ul{margin:16px 0 0 18px;color:var(--muted)}
.intro li{margin-top:4px}
.intro .primary{margin-top:26px}
/* Results */
.hero-res{text-align:center;padding:30px 20px}
.hero-res .big{font-family:"Fraunces",serif;font-size:clamp(2.2rem,8vw,3.2rem);font-weight:700;color:var(--accent);line-height:1.05;margin:8px 0}
.hero-res p{color:var(--muted);max-width:46ch;margin:8px auto 0}
.bars{display:flex;flex-direction:column;gap:18px;margin-top:6px}
.bar-row .lbl{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem}
.bar-row .lbl span{color:var(--muted);font-weight:500}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar-row p{font-size:.9rem;color:var(--muted);margin-top:6px}
.dual{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-top:4px}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.tip{border-left:3px solid var(--accent);padding:2px 0 2px 14px}
.tip b{display:block;margin-bottom:2px}
.tip p{color:var(--muted);font-size:.93rem}
.note{font-size:.84rem;color:var(--muted);background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:18px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.9rem;font-weight:500;transition:transform .25s,opacity .25s;z-index:10;opacity:0;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
footer{margin-top:44px;font-size:.8rem;color:var(--muted);text-align:center}
</style>
</head>

 ["S","N","Sensation","Intuition","Concret, faits, expérience","Possibilités, vision, sens"],
 ["T","F","Pensée","Sentiment","Logique et objectivité","Valeurs et harmonie"],
 ["J","P","Jugement","Perception","Structure et planification","Flexibilité et adaptation"]];
const COMM = {
 D:{n:"Le Pilote",d:"Orienté(e) résultats, direct(e) et décidé(e). Vous aimez l’efficacité et garder le contrôle.",p:"Prendre le temps d’écouter avant de trancher, et reconnaître les émotions de vos interlocuteurs.",w:"Soyez bref, factuel et orienté résultat."},
 E:{n:"L’Inspirant",d:"Enthousiaste, communicatif(ve) et créatif(ve). Vous entraînez les autres par votre énergie.",p:"Structurer vos idées, assurer le suivi et laisser plus d’espace aux autres.",w:"Montrez de l’enthousiasme, parlez vision et reconnaissance."},
 H:{n:"Le Facilitateur",d:"À l’écoute, patient(e) et loyal(e). Vous créez la confiance et la cohésion.",p:"Oser dire non, exprimer vos désaccords et décider plus vite.",w:"Prenez le temps de la relation, rassurez, évitez la brusquerie."},
 M:{n:"L’Analyste",d:"Précis(e), logique et rigoureux(se). Vous fondez vos positions sur les faits.",p:"Accepter l’imperfection, synthétiser davantage et partager vos ressentis.",w:"Apportez des données, de la structure et laissez du temps."}
};
const LEAD = {
 DIR:{n:"Directif",d:"Vous cadrez, décidez et contrôlez. Très efficace en situation d’urgence ou avec des collaborateurs débutants.",r:"Peut freiner l’autonomie et l’engagement sur la durée."},
 COA:{n:"Coach",d:"Vous expliquez, motivez et accompagnez la progression. Idéal pour des collaborateurs en apprentissage.",r:"Chronophage ; peut sembler paternaliste avec des profils expérimentés."},
 PAR:{n:"Participatif",d:"Vous impliquez l’équipe et co-construisez. Idéal avec des collaborateurs compétents qui ont besoin de confiance.",r:"Décisions plus lentes ; flou si le cadre n’est pas clair."},
 DEL:{n:"Délégatif",d:"Vous donnez autonomie et responsabilité. Idéal avec des experts motivés.",r:"Sentiment d’abandon si l’équipe n’est pas prête."}
};
const RES = {
 EMO:{n:"Maîtrise émotionnelle",t:"Nommez l’émotion quand elle monte, puis prenez 3 respirations lentes avant de répondre."},
 OPT:{n:"Optimisme réaliste",t:"Face à un problème, listez 3 scénarios (pire, probable, meilleur) : le probable est rarement le pire."},
 SOU:{n:"Soutien & limites",t:"Identifiez deux personnes à qui demander de l’aide, et entraînez-vous à dire « pas maintenant »."},
 REC:{n:"Récupération",t:"Fixez une heure de déconnexion le soir et protégez un moment ressourçant chaque semaine."}
};

/* ============ ÉTAT & STOCKAGE ============ */
let S = null;
const app = document.getElementById("app");
function loadHist(){try{return JSON.parse(localStorage.getItem("mesc_hist")||"[]")}catch(e){return []}}
function saveHist(h){try{localStorage.setItem("mesc_hist",JSON.stringify(h.slice(0,30)))}catch(e){}}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setAccent(c){document.documentElement.style.setProperty("--accent",c)}
function go(hash){if(location.hash!=="#"+hash){location.hash=hash}else route()}

/* ============ ÉCRANS ============ */
function home(){
 setAccent("#c2552d");
 const hist=loadHist();
 const doneIds=new Set(hist.map(h=>h.id));
 let h=`<div class="fade"><div class="eyebrow">Plateforme d’auto-découverte</div>
 <h1 style="margin-top:8px">Mieux se connaître</h1>
 <p class="lead">Cinq tests courts pour explorer votre personnalité, votre façon de communiquer, de diriger et de faire face au stress. Résultats immédiats et détaillés.</p>
 <div class="grid">`;
 for(const [id,t] of Object.entries(TESTS)){
  h+=`<button class="card test-card" style="--c:${t.color}" onclick="go('${id}')">
   ${doneIds.has(id)?'<span class="done-badge">✓ Fait</span>':''}
   <div class="dot">${t.letter}</div><h3>${t.title}</h3><p>${t.desc}</p>
   <div class="meta"><span class="chip">${t.questions.length} questions</span><span class="chip">${t.time}</span></div></button>`;
 }
 h+=`</div>`;
 if(hist.length){
  h+=`<h2 class="section-title">Vos derniers résultats</h2><div class="card">`;
  for(const x of hist.slice(0,8)){
   h+=`<div class="hist-item"><div><b>${TESTS[x.id]?.title||""}</b>${x.summary}</div><span>${x.date}</span></div>`;
  }
  h+=`</div><button class="link-btn" onclick="clearHist()">Effacer l’historique</button>`;
 }
 h+=`<footer>Outils d’auto-réflexion à visée de développement personnel — ils ne remplacent pas une évaluation par un professionnel.<br>Vos réponses restent sur votre appareil.</footer></div>`;
 app.innerHTML=h;
}
function clearHist(){saveHist([]);home();toast("Historique effacé")}

function intro(id){
 const t=TESTS[id]; setAccent(t.color);
 app.innerHTML=`<div class="fade intro">
  <div class="top"><button class="back" onclick="go('accueil')">← Tous les tests</button></div>
  <div class="eyebrow">${t.questions.length} questions · ${t.time}</div>
  <h1 style="margin-top:8px">${t.title}</h1>
  <p class="lead">${t.desc}</p>
  <ul>${t.intro.map(x=>`<li>${x}</li>`).join("")}</ul>
  <button class="primary" onclick="start('${id}')">Commencer le test</button></div>`;
}

function start(id){
 const t=TESTS[id];
 const qs=t.questions.map(q=>{
  if(t.type==="likert") return {...q,opts:LIKERT.map((l,i)=>({t:l,v:i+1}))};
  const o=q.o.map(([tx,k])=>({t:tx,k}));
  return {...q,opts:t.noShuffle?o:shuffle(o)};
 });
 S={id,qs,ans:new Array(qs.length).fill(null),i:0};
 renderQ();
}

function renderQ(){
 const t=TESTS[S.id], q=S.qs[S.i], n=S.qs.length;
 const pct=Math.round(S.i/n*100);
 const lik=t.type==="likert";
 app.innerHTML=`<div>
  <div class="top"><button class="back" onclick="quit()">✕ Quitter</button><span class="qcount">${S.i+1} / ${n}</span></div>
  <div class="progress"><i style="width:${pct}%"></i></div>
  <div class="fade"><div class="question">${q.t}</div>
  <div class="options ${lik?'likert':''}">
   ${q.opts.map((o,j)=>`<button class="opt ${S.ans[S.i]===j?'sel':''}" onclick="pick(${j})">${lik?`<span class="n">${j+1}</span>`:''}<span>${o.t}</span></button>`).join("")}
  </div></div>
  <div class="nav"><button class="ghost" ${S.i===0?'disabled':''} onclick="prev()">← Précédent</button>
  ${S.ans[S.i]!==null&&S.i<n-1?'<button class="ghost" onclick="next()">Suivant →</button>':''}</div></div>`;
}
let lock=false;
function pick(j){
 if(lock) return; S.ans[S.i]=j; lock=true;
 document.querySelectorAll(".opt").forEach((b,k)=>b.classList.toggle("sel",k===j));
 setTimeout(()=>{lock=false; if(S.i<S.qs.length-1){S.i++;renderQ()}else finish()},230);
}
function prev(){if(S.i>0){S.i--;renderQ()}}
function next(){if(S.i<S.qs.length-1){S.i++;renderQ()}}
function quit(){S=null;go('accueil')}

/* ============ CALCUL DES RÉSULTATS ============ */
function score(){
 const t=TESTS[S.id], sc={}, cnt={};
 S.qs.forEach((q,i)=>{
  const o=q.opts[S.ans[i]];
  if(t.type==="likert"){const v=q.r?6-o.v:o.v; sc[q.k]=(sc[q.k]||0)+v; cnt[q.k]=(cnt[q.k]||0)+1}
  else{sc[o.k]=(sc[o.k]||0)+1}
 });
 return {sc,cnt};
}
const lvl=p=>p>=67?"h":p>=34?"m":"l";
const lvlTxt={h:"Élevé",m:"Modéré",l:"Faible"};
function bar(label,right,pct,txt){
 return `<div class="bar-row"><div class="lbl">${label}<span>${right}</span></div><div class="bar"><i data-w="${pct}"></i></div>${txt?`<p>${txt}</p>`:''}</div>`;
}

function finish(){
 const id=S.id, t=TESTS[id], {sc,cnt}=score();
 let hero="", body="", summary="", copy="";
 if(id==="big-five"){
  const p={};
  for(const k of ["O","C","E","A","N"]){p[k]=Math.round((sc[k]-cnt[k])/(cnt[k]*4)*100)}
  p.S=100-p.N; delete p.N;
  const order=["O","C","E","A","S"];
  const top=order.slice().sort((a,b)=>p[b]-p[a]);
  hero=`<div class="eyebrow">Votre trait le plus marqué</div><div class="big">${B5[top[0]].n}</div><p>${B5[top[0]].h}</p>`;
  body=`<div class="card"><h3 style="margin-bottom:16px">Votre profil sur les 5 dimensions</h3><div class="bars">${order.map(k=>bar(B5[k].n,`${lvlTxt[lvl(p[k])]} · ${p[k]}%`,p[k],B5[k][lvl(p[k])])).join("")}</div>
  <div class="note">Le Big Five décrit des tendances sur un continuum : aucun score n’est « bon » ou « mauvais ». Chaque position a ses atouts selon le contexte.</div></div>`;
  summary=order.map(k=>`${B5[k].n} ${p[k]}%`).join(" · ");
  copy=`Mes 5 grands traits :\n`+order.map(k=>`• ${B5[k].n} : ${p[k]}% (${lvlTxt[lvl(p[k])]})`).join("\n");
 }
 if(id==="profil"){
  let code="", rows="";
  for(const [a,b,na,nb,da,db] of AXES){
   const va=sc[a]||0, vb=sc[b]||0, tot=va+vb, pa=Math.round(va/tot*100);
   const win=va>=vb?a:b; code+=win;
   rows+=`<div class="bar-row"><div class="lbl">${win===a?na:nb}<span>${Math.max(pa,100-pa)}%</span></div>
    <div class="bar"><i data-w="${Math.max(pa,100-pa)}" style="${win===b?'margin-left:auto':''}"></i></div><div class="dual"><span>${a} · ${na}</span><span>${nb} · ${b}</span></div>
    <p>${win===a?da:db}</p></div>`;
  }
  const [nm,ds]=TYPES[code];
  hero=`<div class="eyebrow">Votre profil</div><div class="big">${code}</div><h2>${nm}</h2><p>${ds}</p>`;
  body=`<div class="card"><h3 style="margin-bottom:16px">Vos 4 préférences</h3><div class="bars">${rows}</div>
   <div class="note">Profil inspiré de la typologie de C. G. Jung, en version simplifiée. Les préférences ne sont pas des capacités : vous pouvez tout à fait utiliser le pôle opposé quand la situation l’exige.</div></div>`;
  summary=`${code} — ${nm}`; copy=`Mon profil de préférences : ${code} — ${nm}\n${ds}`;
 }
 if(id==="communication"){
  const ks=["D","E","H","M"], tot=S.qs.length, p={};
  ks.forEach(k=>p[k]=Math.round((sc[k]||0)/tot*100));
  const ord=ks.slice().sort((a,b)=>p[b]-p[a]), d=ord[0], s=ord[1];
  hero=`<div class="eyebrow">Votre style dominant</div><div class="big">${COMM[d].n}</div><p>${COMM[d].d}</p><p style="margin-top:10px">Style secondaire : <b>${COMM[s].n}</b></p>`;
  body=`<div class="card"><h3 style="margin-bottom:16px">Répartition de vos styles</h3><div class="bars">${ord.map(k=>bar(COMM[k].n,p[k]+"%",p[k])).join("")}</div></div>
  <div class="card" style="margin-top:14px"><h3>Pour progresser</h3><div class="stack"><div class="tip"><b>Votre axe de développement</b><p>${COMM[d].p}</p></div></div></div>
  <div class="card" style="margin-top:14px"><h3>Comment parler aux autres styles</h3><div class="stack">${ks.filter(k=>k!==d).map(k=>`<div class="tip"><b>Avec un profil ${COMM[k].n.replace(/^(Le |L’)/,"")}</b><p>${COMM[k].w}</p></div>`).join("")}</div></div>`;
  summary=`${COMM[d].n} (${p[d]}%), puis ${COMM[s].n}`;
  copy=`Mon style de communication :\n`+ord.map(k=>`• ${COMM[k].n} : ${p[k]}%`).join("\n");
 }
 if(id==="leadership"){
  const ks=["DIR","COA","PAR","DEL"], tot=S.qs.length, p={};
  ks.forEach(k=>p[k]=Math.round((sc[k]||0)/tot*100));
  const ord=ks.slice().sort((a,b)=>p[b]-p[a]), d=ord[0];
  const flex=ks.filter(k=>p[k]>=20).length;
  const flexTxt=flex>=3?"Grande flexibilité : vous mobilisez plusieurs styles selon les situations, un vrai atout de manager.":flex===2?"Flexibilité moyenne : vous alternez entre deux styles principaux. Explorez les deux autres pour gagner en adaptabilité.":"Style très affirmé : efficace dans certaines situations, mais pensez à varier selon l’autonomie de chaque collaborateur.";
  hero=`<div class="eyebrow">Votre style naturel</div><div class="big">${LEAD[d].n}</div><p>${LEAD[d].d}</p>`;
  body=`<div class="card"><h3 style="margin-bottom:16px">Votre palette de styles</h3><div class="bars">${ord.map(k=>bar(LEAD[k].n,p[k]+"%",p[k])).join("")}</div>
   <div class="note"><b>Flexibilité : ${flex}/4.</b> ${flexTxt}</div></div>
  <div class="card" style="margin-top:14px"><h3>Forces et vigilances</h3><div class="stack">${ord.map(k=>`<div class="tip"><b>${LEAD[k].n} — ${p[k]}%</b><p>${LEAD[k].d} <i>Vigilance :</i> ${LEAD[k].r}</p></div>`).join("")}</div>
   <div class="note">Selon le modèle du leadership situationnel (Hersey &amp; Blanchard), aucun style n’est supérieur : l’efficacité vient de l’adaptation du style au niveau de compétence et de motivation de chaque collaborateur.</div></div>`;
  summary=`${LEAD[d].n} (${p[d]}%), flexibilité ${flex}/4`;
  copy=`Mon style de leadership :\n`+ord.map(k=>`• ${LEAD[k].n} : ${p[k]}%`).join("\n")+`\nFlexibilité : ${flex}/4`;
 }
 if(id==="resilience"){
  const ks=["EMO","OPT","SOU","REC"], p={};
  ks.forEach(k=>p[k]=Math.round((sc[k]-cnt[k])/(cnt[k]*4)*100));
  const g=Math.round(ks.reduce((a,k)=>a+p[k],0)/4);
  const band=g>=75?["Résilience solide","Vous disposez de ressources variées pour traverser les périodes de pression."]:g>=55?["Bonne base, à renforcer","Vos fondations sont là ; quelques leviers ciblés peuvent faire une vraie différence."]:["Zone de vigilance","Vos ressources semblent sollicitées en ce moment. Prenez soin de vous et appuyez-vous sur votre entourage."];
  const weak=ks.slice().sort((a,b)=>p[a]-p[b]).slice(0,2);
  hero=`<div class="eyebrow">Votre indice de résilience</div><div class="big">${g}<span style="font-size:.45em">/100</span></div><h2>${band[0]}</h2><p>${band[1]}</p>`;
  body=`<div class="card"><h3 style="margin-bottom:16px">Vos 4 ressources</h3><div class="bars">${ks.map(k=>bar(RES[k].n,p[k]+"%",p[k])).join("")}</div></div>
  <div class="card" style="margin-top:14px"><h3>Vos leviers prioritaires</h3><div class="stack">${weak.map(k=>`<div class="tip"><b>${RES[k].n}</b><p>${RES[k].t}</p></div>`).join("")}</div>
  <div class="note">Ce questionnaire est un outil d’auto-réflexion, pas un outil médical. Si vous ressentez un épuisement, une anxiété ou une tristesse qui durent, parlez-en à un médecin ou à un professionnel de santé.</div></div>`;
  summary=`Indice ${g}/100 — ${band[0]}`;
  copy=`Ma résilience face au stress : ${g}/100 (${band[0]})\n`+ks.map(k=>`• ${RES[k].n} : ${p[k]}%`).join("\n");
 }
 const hist=loadHist();
 hist.unshift({id,summary,date:new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"short"})});
 saveHist(hist);
 window._copy=copy;
 app.innerHTML=`<div class="fade">
  <div class="top"><button class="back" onclick="go('accueil')">← Tous les tests</button><span class="qcount">${t.title}</span></div>
  <div class="card hero-res">${hero}</div>
  <div style="margin-top:14px">${body}</div>
  <div class="actions"><button class="primary" onclick="copyRes()">Copier mes résultats</button>
  <button class="secondary" onclick="start('${id}')">Refaire le test</button>
  <button class="secondary" onclick="go('accueil')">Autres tests</button></div></div>`;
 window.scrollTo(0,0);
 requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll(".bar i").forEach(b=>b.style.width=b.dataset.w+"%"),60));
 S=null;
}
function copyRes(){
 try{navigator.clipboard.writeText(window._copy).then(()=>toast("Résultats copiés"),()=>toast("Copie impossible sur cet appareil"))}
 catch(e){toast("Copie impossible sur cet appareil")}
}

/* ============ NAVIGATION ============ */
function route(){
 const h=location.hash.replace("#","");
 if(TESTS[h]) intro(h); else home();
 window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
