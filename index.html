<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Plateforme gratuite de tests de personnalité, de tests pour le travail et de tests de couple et de compatibilité.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23c2552d%22/><text x=%2250%22 y=%2268%22 font-size=%2256%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Georgia%22>M</text></svg>">
<title>Mieux se connaître — Tests de personnalité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f2ec; --card:#fffdf9; --ink:#1f1b16; --muted:#6b6259; --line:#e6ded3;
  --soft:#efe8de; --shadow:0 1px 2px rgba(40,30,20,.06),0 6px 24px rgba(40,30,20,.06);
  --accent:#c2552d;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#171513;--card:#211e1b;--ink:#f1ebe3;--muted:#a59b90;--line:#36312c;--soft:#2b2723;--shadow:0 1px 2px rgba(0,0,0,.3)}
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 60px}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:700;letter-spacing:-.01em;line-height:1.15}
h1{font-size:clamp(2rem,6vw,2.8rem)}
h2{font-size:1.6rem}
h3{font-size:1.15rem}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lead{color:var(--muted);font-size:1.05rem;margin-top:10px;max-width:52ch}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
/* Accueil */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-top:22px;position:sticky;top:0;padding:10px 0;background:var(--bg);z-index:5}
.chips::-webkit-scrollbar{display:none}
.chip-btn{white-space:nowrap;flex:none;padding:8px 15px;border-radius:99px;border:1.5px solid var(--line);font-weight:700;font-size:.9rem;background:var(--card)}
.chip-btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat{margin-top:30px}
.cat-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.cat-head p{color:var(--muted);font-size:.95rem;margin-top:4px}
.cat-count{font-size:.8rem;color:var(--muted);white-space:nowrap;font-weight:500}
.grid{display:grid;gap:12px;margin-top:14px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.test-card{text-align:left;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
.test-card:hover{transform:translateY(-2px);border-color:var(--c)}
.test-card .dot{width:42px;height:42px;border-radius:13px;background:color-mix(in srgb,var(--c) 16%,var(--card));display:grid;place-items:center;font-size:1.3rem}
.test-card p{color:var(--muted);font-size:.94rem}
.new{position:absolute;top:16px;right:16px;font-size:.7rem;font-weight:700;color:#fff;background:var(--c);padding:2px 8px;border-radius:99px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:.76rem;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--muted);font-weight:500}
.done-badge{position:absolute;top:16px;right:16px;font-size:.72rem;font-weight:700;color:var(--c)}
.section-title{margin-top:40px;margin-bottom:12px}
.hist-item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.hist-item:last-child{border:none}
.hist-item b{display:block}
.hist-item span{color:var(--muted);font-size:.82rem;white-space:nowrap}
.link-btn{color:var(--muted);text-decoration:underline;font-size:.85rem;margin-top:10px}
/* Questions */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;font-size:.92rem;padding:6px 0}
.progress{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin:14px 0 26px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.qcount{font-size:.85rem;color:var(--muted);font-weight:500;text-align:right}
.who{display:inline-block;font-size:.8rem;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card));padding:3px 10px;border-radius:99px;margin-bottom:12px}
.question{font-family:"Fraunces",serif;font-size:clamp(1.35rem,4.5vw,1.7rem);font-weight:500;line-height:1.3;min-height:3.2em}
.options{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.opt{width:100%;text-align:left;padding:15px 18px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-size:1rem;font-weight:500;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.likert .opt{display:flex;align-items:center;gap:12px}
.likert .opt .n{width:28px;height:28px;flex:none;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted)}
.likert .opt.sel .n{background:var(--accent);border-color:var(--accent);color:#fff}
.nav{display:flex;justify-content:space-between;margin-top:22px}
.ghost{color:var(--muted);font-weight:500;padding:8px 0}
.ghost:disabled{opacity:.35;cursor:default}
.primary{background:var(--accent);color:#fff;padding:13px 22px;border-radius:12px;font-weight:700}
.secondary{background:var(--soft);padding:13px 22px;border-radius:12px;font-weight:700}
.intro p{color:var(--muted);margin-top:12px}
.intro ul{margin:16px 0 0 18px;color:var(--muted)}
.intro li{margin-top:4px}
.intro .primary{margin-top:26px}
/* Formulaires (compatibilité) */
.choice-card{display:block;width:100%;text-align:left;margin-top:12px}
.choice-card b{display:block;font-size:1.05rem}
.choice-card span{color:var(--muted);font-size:.92rem}
label.f{display:block;font-weight:700;font-size:.9rem;margin-top:18px}
.input{width:100%;margin-top:6px;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1rem}
.input:focus{outline:none;border-color:var(--accent)}
textarea.input{min-height:90px;resize:vertical;font-family:ui-monospace,monospace;font-size:.85rem}
.err{color:#c0392b;font-size:.88rem;margin-top:8px;min-height:1.2em}
.codebox{font-family:ui-monospace,monospace;font-size:.82rem;word-break:break-all;background:var(--soft);border-radius:12px;padding:14px;margin-top:14px;user-select:all}
.handoff{text-align:center;padding:40px 20px}
.handoff .emoji{font-size:3rem}
.handoff p{color:var(--muted);margin:10px auto 0;max-width:40ch}
.handoff .primary{margin-top:24px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.vs div{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:.86rem}
.vs small{display:block;color:var(--muted);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
/* Résultats */
.hero-res{text-align:center;padding:30px 20px}
.hero-res .big{font-family:"Fraunces",serif;font-size:clamp(2.2rem,8vw,3.2rem);font-weight:700;color:var(--accent);line-height:1.05;margin:8px 0}
.hero-res p{color:var(--muted);max-width:46ch;margin:8px auto 0}
.bars{display:flex;flex-direction:column;gap:18px;margin-top:6px}
.bar-row .lbl{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem}
.bar-row .lbl span{color:var(--muted);font-weight:500}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar-row p{font-size:.9rem;color:var(--muted);margin-top:6px}
.dual{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-top:4px}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.tip{border-left:3px solid var(--accent);padding:2px 0 2px 14px}
.tip b{display:block;margin-bottom:2px}
.tip p{color:var(--muted);font-size:.93rem}
.note{font-size:.84rem;color:var(--muted);background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:18px}
.mt{margin-top:14px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.9rem;font-weight:500;transition:transform .25s,opacity .25s;z-index:10;opacity:0;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
footer{margin-top:44px;font-size:.8rem;color:var(--muted);text-align:center}
</style>
</head>

function loadHist(){try{return JSON.parse(localStorage.getItem("mesc_hist")||"[]")}catch(e){return []}}

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setAccent(c){document.documentElement.style.setProperty("--accent",c)}
function go(hash){if(location.hash!=="#"+hash){location.hash=hash}else route()}
function copyText(txt,ok){
 try{navigator.clipboard.writeText(txt).then(()=>toast(ok||"Copié"),()=>toast("Copie impossible : sélectionnez le texte à la main"))}

}
function animateBars(){requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll(".bar i").forEach(b=>b.style.width=b.dataset.w+"%"),60))}

}
const lvl=p=>p>=67?"h":p>=34?"m":"l";
const lvlTxt={h:"Élevé",m:"Modéré",l:"Faible"};

function clearHist(){saveHist([]);home();toast("Historique effacé")}

function intro(id){
 const t=TESTS[id]; setAccent(t.color);
 if(t.type==="compat") return compatIntro();
 app.innerHTML=`<div class="fade intro">
  <div class="top"><button class="back" onclick="go('${t.cat}')">← ${CATS.find(c=>c.id===t.cat).title}</button></div>

/* =====================================================================
   MOTEUR DE QUESTIONS (commun à tous les tests)
   ===================================================================== */
function start(id,opts){
 const t=TESTS[id];
 const qs=t.questions.map(q=>{
  if(t.type==="likert") return {...q,opts:LIKERT.map((l,i)=>({t:l,v:i+1}))};
  if(t.type==="compat") return {...q,opts:q.o.map((tx,i)=>({t:tx,v:i}))};
  const o=q.o.map(([tx,k])=>({t:tx,k}));
  return {...q,opts:t.noShuffle?o:shuffle(o)};
 });
 S={id,qs,ans:new Array(qs.length).fill(null),i:0,who:opts&&opts.who,onDone:(opts&&opts.onDone)||finish};
 renderQ();
}
function renderQ(){
 const t=TESTS[S.id], q=S.qs[S.i], n=S.qs.length, lik=t.type==="likert";
 app.innerHTML=`<div>
  <div class="top"><button class="back" onclick="quit()">✕ Quitter</button><span class="qcount">${S.i+1} / ${n}</span></div>
  <div class="progress"><i style="width:${Math.round(S.i/n*100)}%"></i></div>
  <div class="fade">${S.who?`<span class="who">Réponses de ${esc(S.who)}</span>`:""}<div class="question">${q.t}</div>
  <div class="options ${lik?"likert":""}">
   ${q.opts.map((o,j)=>`<button class="opt ${S.ans[S.i]===j?"sel":""}" onclick="pick(${j})">${lik?`<span class="n">${j+1}</span>`:""}<span>${o.t}</span></button>`).join("")}
  </div></div>
  <div class="nav"><button class="ghost" ${S.i===0?"disabled":""} onclick="prev()">← Précédent</button>
  ${S.ans[S.i]!==null&&S.i<n-1?'<button class="ghost" onclick="next()">Suivant →</button>':""}</div></div>`;
 window.scrollTo(0,0);
}
let lock=false;
function pick(j){
 if(lock) return; S.ans[S.i]=j; lock=true;
 document.querySelectorAll(".opt").forEach((b,k)=>b.classList.toggle("sel",k===j));
 setTimeout(()=>{lock=false; if(S.i<S.qs.length-1){S.i++;renderQ()}else{const s=S;S=null;s.onDone(s)}},230);
}
function prev(){if(S.i>0){S.i--;renderQ()}}
function next(){if(S.i<S.qs.length-1){S.i++;renderQ()}}
function quit(){S=null;C=null;go("accueil")}

/* =====================================================================
   CALCUL ET AFFICHAGE DES RÉSULTATS
   ===================================================================== */
function score(s){
 const t=TESTS[s.id], sc={}, cnt={};
 s.qs.forEach((q,i)=>{
  const o=q.opts[s.ans[i]];
  if(t.type==="likert"){const v=q.r?6-o.v:o.v; sc[q.k]=(sc[q.k]||0)+v; cnt[q.k]=(cnt[q.k]||0)+1}
  else{sc[o.k]=(sc[o.k]||0)+1}
 });
 return {sc,cnt};
}
const likPct=(sc,cnt,k)=>Math.round((sc[k]-cnt[k])/(cnt[k]*4)*100);

function finish(s){
 const id=s.id, t=TESTS[id], {sc,cnt}=score(s);
 const R={big5:rBig5,profil:rProfil,profile:rProfile,facets:rFacets,attach:rAttach}[t.render==="bigfive"?"big5":t.render](t,sc,cnt);
 addHist(id,R.summary);
 showResult(t,R.hero,R.body,R.copy,`start('${id}')`);
}
function showResult(t,hero,body,copy,redo){
 window._copy=copy;
 app.innerHTML=`<div class="fade">
  <div class="top"><button class="back" onclick="go('${t.cat}')">← ${CATS.find(c=>c.id===t.cat).title}</button><span class="qcount">${t.title}</span></div>
  <div class="card hero-res">${hero}</div>
  <div class="mt">${body}</div>
  <div class="actions"><button class="primary" onclick="copyText(window._copy,'Résultats copiés')">Copier mes résultats</button>
  <button class="secondary" onclick="${redo}">Refaire le test</button>
  <button class="secondary" onclick="go('accueil')">Autres tests</button></div></div>`;
 window.scrollTo(0,0); animateBars();
}

/* Big Five */
function rBig5(t,sc,cnt){
 const p={}; for(const k of ["O","C","E","A","N"]) p[k]=likPct(sc,cnt,k);
 p.S=100-p.N;
 const order=["O","C","E","A","S"], top=order.slice().sort((a,b)=>p[b]-p[a])[0];
 return {
  hero:`<div class="eyebrow">Votre trait le plus marqué</div><div class="big">${B5[top].n}</div><p>${B5[top].h}</p>`,
  body:`<div class="card"><h3 style="margin-bottom:16px">Votre profil sur les 5 dimensions</h3><div class="bars">${order.map(k=>bar(B5[k].n,`${lvlTxt[lvl(p[k])]} · ${p[k]}%`,p[k],B5[k][lvl(p[k])])).join("")}</div>
   <div class="note">Le Big Five décrit des tendances sur un continuum : aucun score n’est « bon » ou « mauvais ». Chaque position a ses atouts selon le contexte.</div></div>`,
  summary:order.map(k=>`${B5[k].n} ${p[k]}%`).join(" · "),
  copy:`Mes 5 grands traits :\n`+order.map(k=>`• ${B5[k].n} : ${p[k]}% (${lvlTxt[lvl(p[k])]})`).join("\n")
 };
}
/* Profil 16 types */
function rProfil(t,sc){
 let code="",rows="";
 for(const [a,b,na,nb,da,db] of AXES){
  const va=sc[a]||0,vb=sc[b]||0,pa=Math.round(va/(va+vb)*100),win=va>=vb?a:b; code+=win;
  rows+=`<div class="bar-row"><div class="lbl">${win===a?na:nb}<span>${Math.max(pa,100-pa)}%</span></div>
   <div class="bar"><i data-w="${Math.max(pa,100-pa)}" style="${win===b?"margin-left:auto":""}"></i></div><div class="dual"><span>${a} · ${na}</span><span>${nb} · ${b}</span></div><p>${win===a?da:db}</p></div>`;
 }
 const [nm,ds]=TYPES[code];
 return {
  hero:`<div class="eyebrow">Votre profil</div><div class="big">${code}</div><h2>${nm}</h2><p>${ds}</p>`,
  body:`<div class="card"><h3 style="margin-bottom:16px">Vos 4 préférences</h3><div class="bars">${rows}</div>
   <div class="note">Profil inspiré de la typologie de C. G. Jung, en version simplifiée. Les préférences ne sont pas des capacités : vous pouvez utiliser le pôle opposé quand la situation l’exige.</div></div>`,
  summary:`${code} — ${nm}`, copy:`Mon profil de préférences : ${code} — ${nm}\n${ds}`
 };
}
/* Profils à styles (communication, leadership, conflits, motivations, langages) */
function rProfile(t,sc){
 const ks=Object.keys(t.styles), max={};
 ks.forEach(k=>max[k]=t.questions.filter(q=>q.o.some(o=>o[1]===k)).length);
 const p={}; ks.forEach(k=>p[k]=Math.round((sc[k]||0)/max[k]*100));
 const ord=ks.slice().sort((a,b)=>p[b]-p[a]), d=ord[0], s2=ord[1], S_=t.styles;
 let hero=`<div class="eyebrow">${t.heroLabel}</div><div class="big">${S_[d].n}</div><p>${S_[d].d}</p>`;
 if(t.showSecondary!==false) hero+=`<p style="margin-top:10px">En second : <b>${S_[s2].n}</b></p>`;
 let body=`<div class="card"><h3 style="margin-bottom:16px">${t.barsTitle}</h3><div class="bars">${ord.map(k=>bar(S_[k].n,p[k]+"%",p[k])).join("")}</div>`;
 if(t.flex){
  const f=ks.filter(k=>p[k]>=20).length;
  const ft=f>=3?"Grande flexibilité : vous mobilisez plusieurs styles selon les situations, un vrai atout.":f===2?"Flexibilité moyenne : vous alternez entre deux styles principaux. Explorez les autres pour gagner en adaptabilité.":"Style très affirmé : efficace dans certaines situations, mais pensez à varier selon l’autonomie de chacun.";
  body+=`<div class="note"><b>Flexibilité : ${f}/4.</b> ${ft}</div>`;
 }
 body+=`</div>`;
 if(t.tipTitle) body+=`<div class="card mt"><h3>${t.tipTitle}</h3><div class="stack"><div class="tip"><b>${S_[d].n}</b><p>${S_[d].p}</p></div></div></div>`;
 if(t.othersTitle) body+=`<div class="card mt"><h3>${t.othersTitle}</h3><div class="stack">${ks.filter(k=>k!==d).map(k=>`<div class="tip"><b>Avec un profil ${S_[k].short}</b><p>${S_[k].w}</p></div>`).join("")}</div></div>`;
 if(t.detail){
  const list=t.detail==="all"?ord:ord.slice(0,t.detail);
  body+=`<div class="card mt"><h3>${t.detailTitle}</h3><div class="stack">${list.map(k=>`<div class="tip"><b>${S_[k].n} — ${p[k]}%</b><p>${S_[k].d}${S_[k].r&&t.detail==="all"?` <i>Vigilance :</i> ${S_[k].r}`:""}${t.pLabel?` <i>${t.pLabel}</i> ${S_[k].p}`:""}</p></div>`).join("")}</div>
   ${t.footnote?`<div class="note">${t.footnote}</div>`:""}</div>`;
 } else if(t.footnote) body+=`<div class="note">${t.footnote}</div>`;
 return {hero,body,summary:`${S_[d].n} (${p[d]}%), puis ${S_[s2].n}`,
  copy:`${t.title} :\n`+ord.map(k=>`• ${S_[k].n} : ${p[k]}%`).join("\n")};
}
/* Tests à facettes avec score global (estime de soi, IE, résilience, santé du couple) */
function rFacets(t,sc,cnt){
 const ks=Object.keys(t.facets), p={};
 ks.forEach(k=>p[k]=likPct(sc,cnt,k));
 const g=Math.round(ks.reduce((a,k)=>a+p[k],0)/ks.length);
 const band=t.bands.find(b=>g>=b[0]);
 const hero=`<div class="eyebrow">${t.heroLabel}</div><div class="big">${g}<span style="font-size:.45em">/100</span></div><h2>${band[1]}</h2><p>${band[2]}</p>`;
 let body="";
 if(ks.length>1) body+=`<div class="card"><h3 style="margin-bottom:16px">Vos ${ks.length} dimensions</h3><div class="bars">${ks.map(k=>bar(t.facets[k].n,p[k]+"%",p[k])).join("")}</div></div>`;
 const tips=t.fixedTips?t.fixedTips:ks.slice().sort((a,b)=>p[a]-p[b]).slice(0,2).map(k=>[t.facets[k].n,t.facets[k].t]);
 body+=`<div class="card ${ks.length>1?"mt":""}"><h3>${t.tipsTitle||"Pour aller plus loin"}</h3><div class="stack">${tips.map(([a,b])=>`<div class="tip"><b>${a}</b><p>${b}</p></div>`).join("")}</div>
  ${t.note?`<div class="note">${t.note}</div>`:""}</div>`;
 return {hero,body,summary:`${g}/100 — ${band[1]}`,
  copy:`${t.title} : ${g}/100 (${band[1]})`+(ks.length>1?"\n"+ks.map(k=>`• ${t.facets[k].n} : ${p[k]}%`).join("\n"):"")};
}
/* Style d’attachement */
function rAttach(t,sc,cnt){
 const ks=["SEC","ANX","EVI"], p={}; ks.forEach(k=>p[k]=likPct(sc,cnt,k));
 let d=ks.slice().sort((a,b)=>p[b]-p[a])[0];
 if(p.ANX>=60&&p.EVI>=60&&p.SEC<Math.max(p.ANX,p.EVI)) d="CRA";
 const F=t.facets;
 return {
  hero:`<div class="eyebrow">Votre style d’attachement dominant</div><div class="big">${F[d].n}</div><p>${F[d].d}</p>`,
  body:`<div class="card"><h3 style="margin-bottom:16px">Vos 3 tendances</h3><div class="bars">${ks.map(k=>bar(F[k].n,p[k]+"%",p[k])).join("")}</div></div>
   <div class="card mt"><h3>Pour vos relations</h3><div class="stack"><div class="tip"><b>${F[d].n}</b><p>${F[d].t}</p></div></div>
   <div class="note">Les styles d’attachement ne sont pas des étiquettes figées : ils évoluent avec les expériences, et une relation sécurisante peut aider chacun à devenir plus « sécure ». Ce test est un outil de réflexion, pas un diagnostic.</div></div>`,
  summary:`${F[d].n} (sécure ${p.SEC}%, anxieux ${p.ANX}%, évitant ${p.EVI}%)`,
  copy:`Mon style d’attachement : ${F[d].n}\n`+ks.map(k=>`• ${F[k].n} : ${p[k]}%`).join("\n")
 };
}

/* =====================================================================
   TEST DE COMPATIBILITÉ À DEUX
   ===================================================================== */
const CT=()=>TESTS["compatibilite"];
function compatIntro(){
 const t=CT(); setAccent(t.color); C=null;
 app.innerHTML=`<div class="fade intro">
  <div class="top"><button class="back" onclick="go('couple')">← Couple &amp; amour</button></div>
  <div class="eyebrow">${t.questions.length} questions chacun · ${t.time}</div>
  <h1 style="margin-top:8px">${t.icon} Compatibilité à deux</h1>
  <p class="lead">${t.desc}</p>
  <ul><li>Communication, vie quotidienne, argent, projets d’avenir, loisirs, affection : 6 domaines comparés.</li><li>Répondez honnêtement, sans regarder les réponses de l’autre.</li></ul>
  <h3 style="margin-top:26px">Comment voulez-vous jouer ?</h3>
  <button class="card choice-card" onclick="compatNames('same')"><b>📱 À deux, sur ce téléphone</b><span>Chacun répond à son tour, puis vous découvrez le résultat ensemble.</span></button>
  <button class="card choice-card" onclick="compatNames('send')"><b>📤 Chacun sur son téléphone</b><span>Vous répondez, puis vous envoyez un code à votre partenaire.</span></button>
  <button class="card choice-card" onclick="compatReceive()"><b>📥 J’ai reçu un code</b><span>Votre partenaire a déjà répondu : collez son code et répondez à votre tour.</span></button>
 </div>`;
}
function compatNames(mode){
 app.innerHTML=`<div class="fade intro">
  <div class="top"><button class="back" onclick="compatIntro()">← Retour</button></div>
  <h2>${mode==="same"?"Vos prénoms":"Votre prénom"}</h2>
  <label class="f" for="na">${mode==="same"?"Partenaire 1":"Votre prénom"}</label><input class="input" id="na" maxlength="20" autocomplete="off">
  ${mode==="same"?'<label class="f" for="nb">Partenaire 2</label><input class="input" id="nb" maxlength="20" autocomplete="off">':""}
  <div class="err" id="err"></div>
  <button class="primary" onclick="compatGo('${mode}')">Commencer</button></div>`;
 document.getElementById("na").focus();
}
function compatGo(mode){
 const a=document.getElementById("na").value.trim(), bEl=document.getElementById("nb"), b=bEl?bEl.value.trim():"";
 if(!a||(mode==="same"&&!b)){document.getElementById("err").textContent="Merci d’indiquer "+(mode==="same"?"les deux prénoms.":"votre prénom.");return}
 C={mode,a,b};
 start("compatibilite",{who:a,onDone:s=>{
  C.ansA=s.ans.slice();
  if(mode==="same") handoff(); else showCode();
 }});
}
function handoff(){
 app.innerHTML=`<div class="fade card handoff"><div class="emoji">🔄</div><h2>Merci ${esc(C.a)} !</h2>
  <p>Passez maintenant le téléphone à <b>${esc(C.b)}</b>. Pas de triche : on ne regarde pas les réponses de l’autre.</p>
  <button class="primary" onclick="startB()">Je suis ${esc(C.b)}, je commence</button></div>`;
 window.scrollTo(0,0);
}
function startB(){start("compatibilite",{who:C.b,onDone:s=>{C.ansB=s.ans.slice();compatResult()}})}
function encodeCode(name,ans){
 const json=JSON.stringify({n:name,a:ans.join("")});
 return "CPL-"+btoa(unescape(encodeURIComponent(json)));
}
function decodeCode(code){
 try{
  const raw=code.trim().replace(/^CPL-/i,"").replace(/\s/g,"");
  const o=JSON.parse(decodeURIComponent(escape(atob(raw))));
  const n=CT().questions.length;
  if(!o.n||!/^[0-3]+$/.test(o.a)||o.a.length!==n) return null;
  return {n:String(o.n).slice(0,20),a:o.a.split("").map(Number)};
 }catch(e){return null}
}
function showCode(){
 const code=encodeCode(C.a,C.ansA); window._code=code;
 const msg=`Fais le test de compatibilité avec moi 💞 Ouvre la plateforme « Mieux se connaître », choisis « Test de compatibilité à deux » puis « J’ai reçu un code », et colle ce code :\n${code}`;
 window._msg=msg;
 app.innerHTML=`<div class="fade">
  <div class="top"><button class="back" onclick="go('couple')">← Couple &amp; amour</button></div>
  <div class="card handoff"><div class="emoji">📤</div><h2>C’est à votre partenaire !</h2>
  <p>Envoyez-lui ce code (WhatsApp, SMS…). Il ou elle ouvre la plateforme, choisit le test de compatibilité, puis « J’ai reçu un code ».</p>
  <div class="codebox">${code}</div>
  <div class="actions" style="justify-content:center"><button class="primary" onclick="copyText(window._msg,'Message et code copiés')">Copier le message</button>
  <button class="secondary" onclick="copyText(window._code,'Code copié')">Copier le code seul</button></div>
  <p style="font-size:.85rem">Le résultat s’affichera sur son téléphone : demandez-lui de vous le copier, ou faites le test ensemble.</p></div></div>`;
 window.scrollTo(0,0);
}
function compatReceive(){
 app.innerHTML=`<div class="fade intro">
  <div class="top"><button class="back" onclick="compatIntro()">← Retour</button></div>
  <h2>Code de votre partenaire</h2>
  <label class="f" for="code">Collez le code reçu</label><textarea class="input" id="code" placeholder="CPL-…"></textarea>
  <label class="f" for="nb">Votre prénom</label><input class="input" id="nb" maxlength="20" autocomplete="off">
  <div class="err" id="err"></div>
  <button class="primary" onclick="compatReceiveGo()">Répondre à mon tour</button></div>`;
}
function compatReceiveGo(){
 const d=decodeCode(document.getElementById("code").value), b=document.getElementById("nb").value.trim();
 const err=document.getElementById("err");
 if(!d){err.textContent="Ce code n’est pas valide. Vérifiez qu’il a été copié en entier.";return}
 if(!b){err.textContent="Merci d’indiquer votre prénom.";return}
 C={mode:"recv",a:d.n,b,ansA:d.a};
 start("compatibilite",{who:b,onDone:s=>{C.ansB=s.ans.slice();compatResult()}});
}
function compatResult(){
 const t=CT(), Q=t.questions, A=C.ansA, B=C.ansB;
 const sim=Q.map((q,i)=>1-Math.abs(A[i]-B[i])/3);
 let wsum=0,tot=0; Q.forEach((q,i)=>{const w=q.w||1;wsum+=w;tot+=sim[i]*w});
 const g=Math.round(tot/wsum*100);
 const dom={}; Q.forEach((q,i)=>{(dom[q.d]=dom[q.d]||[]).push(sim[i])});
 const dp={}; for(const k in dom) dp[k]=Math.round(dom[k].reduce((a,b)=>a+b,0)/dom[k].length*100);
 const band=g>=80?["Très forte compatibilité","Vous partagez une vision très proche de la vie à deux. Profitez-en pour cultiver ce qui vous rapproche."]:
  g>=65?["Bonne compatibilité","Vous vous rejoignez sur l’essentiel, avec quelques différences qui peuvent devenir des forces si vous en parlez."]:
  g>=50?["Compatibilité à construire","Vous avez des points communs, mais aussi des attentes différentes. Le dialogue sera votre meilleur allié."]:
  ["Des différences importantes","Vos attentes divergent sur plusieurs sujets. Ce n’est pas une condamnation : beaucoup de couples heureux sont très différents, à condition d’en parler."];
 const agree=Q.map((q,i)=>i).filter(i=>A[i]===B[i]);
 const gaps=Q.map((q,i)=>i).filter(i=>Math.abs(A[i]-B[i])>=2).sort((x,y)=>Math.abs(A[y]-B[y])-Math.abs(A[x]-B[x]));
 const na=esc(C.a), nb=esc(C.b);
 const hero=`<div class="eyebrow">${na} &amp; ${nb}</div><div class="big">${g}%</div><h2>${band[0]}</h2><p>${band[1]}</p>`;
 let body=`<div class="card"><h3 style="margin-bottom:16px">Votre compatibilité par domaine</h3><div class="bars">${Object.keys(t.domains).map(k=>bar(t.domains[k],dp[k]+"%",dp[k])).join("")}</div></div>`;
 body+=`<div class="card mt"><h3>✅ Vos points d’accord (${agree.length})</h3><div class="stack">${agree.length?agree.slice(0,6).map(i=>`<div class="tip"><b>${Q[i].t}</b><p>Tous les deux : ${Q[i].o[A[i]].toLowerCase()}</p></div>`).join(""):"<p style=\"color:var(--muted)\">Aucune réponse identique, mais des réponses proches comptent aussi !</p>"}</div></div>`;
 body+=`<div class="card mt"><h3>💬 À discuter ensemble (${gaps.length})</h3>${gaps.length?`<div class="stack">${gaps.map(i=>`<div class="tip"><b>${Q[i].t}</b><div class="vs"><div><small>${na}</small>${Q[i].o[A[i]]}</div><div><small>${nb}</small>${Q[i].o[B[i]]}</div></div></div>`).join("")}</div>
  <div class="note">Une différence n’est pas un problème en soi : ce qui compte, c’est d’en parler. Prenez un sujet à la fois, chacun explique ce qui est important pour lui, puis cherchez ensemble un terrain d’entente.</div>`:
  `<p style="color:var(--muted);margin-top:10px">Aucun écart important : vos visions sont très proches sur tous les sujets abordés.</p>`}</div>`;
 body+=`<div class="note">Test ludique d’auto-réflexion : il compare des préférences, pas la solidité d’un couple, qui dépend surtout de la façon dont vous communiquez et gérez vos différences.</div>`;
 const copy=`Test de compatibilité — ${C.a} & ${C.b} : ${g}% (${band[0]})\n`+Object.keys(t.domains).map(k=>`• ${t.domains[k]} : ${dp[k]}%`).join("\n")+(gaps.length?`\nÀ discuter : `+gaps.map(i=>Q[i].t.replace(/[…:]$/,"").trim()).join(" / "):"");
 addHist("compatibilite",`${C.a} & ${C.b} : ${g}%`);
 showResult(t,hero,body,copy,"compatIntro()");
}

/* =====================================================================
   NAVIGATION
   ===================================================================== */
function route(){
 const h=location.hash.replace("#","");
 S=null;
 if(TESTS[h]) intro(h);
 else if(CATS.some(c=>c.id===h)) home(h);
 else home();
 window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
